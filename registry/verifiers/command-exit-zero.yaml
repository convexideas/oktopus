kind: verifier
name: command-exit-zero
version: 0.1.0
status: active
description: Verify a command exits with status code zero.
entrypoint:
  type: builtin
  name: command_exit_zero
inputs:
  fields:
    - command
    - cwd
outputs:
  fields:
    - passed
    - exit_code
    - output_artifact
permissions:
  filesystem: scoped_workspace
  network: false
  secrets: none
