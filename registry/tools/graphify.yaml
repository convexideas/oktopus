kind: tool
name: graphify
version: 0.1.0
status: active
description: Build code/content knowledge graph and produce clustered HTML/JSON/report artifacts.
entrypoint:
  type: cli
  command: graphify
inputs:
  paths:
    - path
outputs:
  artifacts:
    - graphify-out/GRAPH_REPORT.md
    - graphify-out/graph.json
    - graphify-out/index.html
permissions:
  filesystem: read_project
  network: false
  secrets: none
verification:
  commands:
    - test -f graphify-out/GRAPH_REPORT.md
    - test -f graphify-out/graph.json
