kind: workflow
name: sdlc-default
version: 0.1.0
status: active
description: Default spec → plan → build → test → review → ship workflow using imported agent-skills.
steps:
  - id: spec
    kind: agent
    runtime: runtime:pi
    uses: skill:spec-driven-development
    outputs:
      artifacts:
        - spec.md

  - id: plan
    kind: agent
    runtime: runtime:pi
    uses: skill:planning-and-task-breakdown
    needs:
      - spec
    outputs:
      artifacts:
        - plan.md
        - tasks.json

  - id: build
    kind: agent
    runtime: runtime:pi
    uses: skill:incremental-implementation
    needs:
      - plan
    outputs:
      artifacts:
        - patch.diff
        - implementation-notes.md

  - id: test
    kind: verifier
    runtime: runtime:shell
    uses: skill:test-driven-development
    needs:
      - build
    outputs:
      artifacts:
        - test-output.log

  - id: review
    kind: adversarial_review
    runtime: runtime:pi
    uses: persona:code-reviewer
    needs:
      - test
    outputs:
      artifacts:
        - review.md

  - id: ship
    kind: approval
    uses: skill:shipping-and-launch
    needs:
      - review
    outputs:
      artifacts:
        - ship-decision.md
policy:
  approval_required_for:
    - ship
  persona_can_spawn_personas: false
