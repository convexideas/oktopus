kind: tool
name: openspec
version: 0.1.0
status: active
description: Validate and manage OpenSpec changes and canonical specs.
entrypoint:
  type: cli
  command: openspec
inputs:
  fields:
    - command
    - cwd
outputs:
  artifacts:
    - verifier_result
permissions:
  filesystem: scoped_workspace
  network: false
  secrets: none
