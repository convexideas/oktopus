kind: tool
name: archon
version: 0.1.0
status: active
description: Run explicit Archon workflow commands and produce Oktopus artifacts or inactive capability proposals.
entrypoint:
  type: adapter
  adapter: archon
inputs:
  fields:
    - mode
    - workflow
    - prompt
    - cwd
outputs:
  artifacts:
    - archon-command.json
    - archon-output.json
    - archon-report.md
    - proposals/
permissions:
  filesystem: scoped_workspace
  network: policy_controlled
  secrets: explicit_allowlist
policy:
  no_auto_install: true
