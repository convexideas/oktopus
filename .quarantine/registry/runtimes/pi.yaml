kind: runtime
name: pi
version: 0.1.0
status: active
description: Pi Coding Agent runtime adapter stub for local MVP.
entrypoint:
  type: adapter
  adapter: pi
inputs:
  fields:
    - task
    - persona
    - skills
    - context
    - allowed_tools
    - acceptance
outputs:
  artifacts:
    - final_response.md
    - events.jsonl
    - tool_calls.jsonl
permissions:
  filesystem: scoped_workspace
  network: policy_controlled
  secrets: explicit_allowlist
